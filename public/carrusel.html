<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos de Carruseles</title>
    <link rel="stylesheet" href="css/carrusel.css">
</head>
<body>
    <h1>Carrusel Infinito con Arrastre Libre</h1>

    <section class="carousel-section">
        <h2>Explora nuestra flota</h2>
        <p>Arrastra con el mouse para navegar libremente por las imágenes.</p>
        <div class="carousel-container js-carousel" id="jsCarousel1">
            <div class="carousel-inner">
                <!-- Generado dinámicamente o manualmente -->
                <div class="carousel-item"><img src="img/products/auto1.jpg" alt="Auto 1"></div>
                <div class="carousel-item"><img src="img/products/auto2.jpg" alt="Auto 2"></div>
                <div class="carousel-item"><img src="img/products/auto3.jpg" alt="Auto 3"></div>
                <div class="carousel-item"><img src="img/products/auto4.jpg" alt="Auto 4"></div>
                <div class="carousel-item"><img src="img/products/auto5.jpg" alt="Auto 5"></div>
                <div class="carousel-item"><img src="img/products/auto6.jpg" alt="Auto 6"></div>
                <div class="carousel-item"><img src="img/products/auto7.jpg" alt="Auto 7"></div>
                <div class="carousel-item"><img src="img/products/auto8.jpg" alt="Auto 8"></div>
                <div class="carousel-item"><img src="img/products/auto9.jpg" alt="Auto 9"></div>
                <div class="carousel-item"><img src="img/products/auto10.jpg" alt="Auto 10"></div>
            </div>
            <button class="carousel-control prev">&#10094;</button>
            <button class="carousel-control next">&#10095;</button>
            <div class="carousel-indicators">
                <!-- 6 posiciones posibles para mostrar de 5 en 5 (10 - 5 + 1) -->
                <!-- El JS manejará la activación -->
            </div>
        </div>
    </section>


    <script src="js/carrusel.js"></script>
</body>
</html>
