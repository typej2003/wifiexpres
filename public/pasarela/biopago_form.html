<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: white; margin: 0; }
        
        /* Estilo de las etiquetas (Labels) */
        .label { 
            display: block; 
            color: #6200ea; 
            font-weight: 800; 
            font-size: 16px; 
            margin-bottom: 8px; 
            text-transform: uppercase;
        }

        /* Estilo de los Inputs para que coincidan con el Login */
        input, select { 
            width: 100%; 
            padding: 15px; 
            border: 3px solid #e0e0e0; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            box-sizing: border-box;
            font-size: 22px; /* Mismo tamaño que el login */
            font-weight: 800; /* Negrita intensa */
            color: #1a1a1a; 
            background-color: #fafafa;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #6200ea;
            background-color: #fff;
        }

        /* Ajuste específico para el correo (el texto suele ser más largo) */
        input[type="email"] {
            font-size: 18px; /* Un poco más pequeño para que no se corte si es largo */
        }

        .row { display: flex; gap: 8px; }
        
        .btn-pay { 
            background: #ff6d00; color: white; border: none; width: 100%; 
            padding: 16px; border-radius: 50px; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; margin-top: 5px;
            font-size: 16px;
        }

        h3 { color: #333; font-size: 18px; margin: 0 0 15px 0; text-align: center; font-weight: 800; }

        .error-msg { 
            color: #d32f2f; background: #ffebee; padding: 10px; 
            border-radius: 8px; font-size: 12px; text-align: center; 
            display: none; margin-bottom: 15px; border: 1px solid #ffcdd2;
        }

        /* Estilo para el campo de solo lectura (Monto) */
        input[readonly] {
            background: #f5f5f5;
            color: #555;
            border-color: #eee;
        }
    </style>
</head>
<body>
    <h3>DATOS BIOPAGO</h3>
    <div id="error" class="error-msg"></div>
    
    <form id="pago-form">
        <input type="hidden" id="identity">
        
        <label class="label">Monto del Plan (Bs.)</label>
        <input type="number" step="0.01" id="amount" value="1" readonly>

        <label class="label">Teléfono Origen</label>
        <input type="tel" id="cellphone" value="04165800403" required>

        <label class="label">Documento de Identidad</label>
        <div class="row">
            <select id="identificationNac" style="flex: 1;">
                <option value="V" selected>V</option>
                <option value="E">E</option>
                <option value="P">P</option>
                <option value="J">J</option>
            </select>
            <input type="number" id="identificationNumber" value="" style="flex: 3;" required>
        </div>

        <label class="label">Correo Electrónico</label>
        <input type="email" id="email" value="typej2003@gmail.com" required>

        <button type="button" class="btn-pay" id="main-btn" onclick="enviarPeticion()">Pagar Ahora</button>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const planName = urlParams.get('plan') || 'plan_prueba';
        const planCost = urlParams.get('amount') || '1';
        const routerIdentity = urlParams.get('identity') || 'MikroTik';
        const userPhone = urlParams.get('user');
        const userEmail = urlParams.get('email');

        document.getElementById('identity').value = routerIdentity;
        
        if(urlParams.has('amount')) {
            document.getElementById('amount').value = planCost;
        }

        if(userPhone) {
            document.getElementById('cellphone').value = userPhone;
        }

        if(userEmail) {
            document.getElementById('email').value = userEmail;
        }

        async function enviarPeticion() {
            const btn = document.getElementById('main-btn');
            const errorDiv = document.getElementById('error');
            
            const tel = document.getElementById('cellphone').value;
            const amt = document.getElementById('amount').value;
            const correo = document.getElementById('email').value;

            const objetoPlan = {
                plan: planName,
                costo: amt,
                email_cliente: correo,
                hotspot_user: tel
            };

            const identityValue = document.getElementById('identity').value;

            const data = {
                planPasarela: JSON.stringify(objetoPlan),
                amount: amt,
                cellphone: tel,
                identificationNac: document.getElementById('identificationNac').value,
                identificationNumber: document.getElementById('identificationNumber').value,
                email: correo,
                currency: 1,
                title: 'Pago de Servicio Wifi',
                description: `Plan ${planName}`,
                reference: 'WIFI',
                identity: identityValue,
                rifLetter: '',
                rifNumber: ''
            };

            btn.innerText = "CONECTANDO...";
            btn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('https://wifiexpres.com/api/mikrotikPasarela', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.response && result.response.success) {
                    window.location.href = result.response.urlPayment;
                } else {
                    const msg = result.response ? result.response.responseMessage : "Error en pasarela";
                    throw new Error(msg);
                }
            } catch (e) {
                btn.innerText = "PAGAR AHORA";
                btn.disabled = false;
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
